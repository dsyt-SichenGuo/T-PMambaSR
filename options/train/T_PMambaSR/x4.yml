# general settings for image SR training
name: T_PMambaSR_x4
model_type: T_PMambaSRModel
scale: 4
num_gpu: 2
manual_seed: 10

# dataset and data loader settings
datasets:
  train:
    task: SR
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt:
      - /home/gsc/dataset/DIV2K/HR
    dataroot_lq:
      - /home/gsc/dataset/DIV2K/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val_1:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /home/gsc/dataset/SR/Set14/HR
    dataroot_lq: /home/gsc/dataset/SR/Set14/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
  
  val_2:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: /home/gsc/dataset/SR/Set5/HR
    dataroot_lq: /home/gsc/dataset/SR/Set5/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk



network_g:
  type: T_PMambaSR
  upscale: 4
  in_chans: 3
  img_size: 64
  img_range: 1.
  embed_dim: 48
  d_state: 8
  depths: [ 2, 2, 2, 2 ]
  num_heads: [ 4, 4, 4, 4 ]
  window_size: 16
  convffn_kernel_size: 5
  mlp_ratio: 1.0
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'



# path
path:
  pretrain_network_g: experiments/T-PMamba/T_PMambaSR_x2.pth
  strict_load_g: false
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    #lr: !!float 2e-4
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [150000, 225000, 262500, 287500]
    #milestones: [5000, 10000, 15000, 20000，25000，30000，35000]
    gamma: 0.5

  total_iter: 300000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
# validation settings
val:
  val_freq: !!float 2.5e3
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true



# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 2.5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500